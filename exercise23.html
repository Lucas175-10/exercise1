<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Engineer and Designer Cooperation</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      padding: 20px;
    }

    .preview-image {
      width: 450px;
      height: 240px;
      display: block;
      margin-bottom: 10px;
      object-fit: cover; 
    }

    .info-btn {
      height: 22px;
      border-radius: 8px;
      background-color: #ffffff;
      border: 1px solid #f2f2f2;
      font-family: 'Roboto', sans-serif;
      font-size: 13px;
      color: #2f2f2f;
      cursor: pointer;
      padding: 0 15px;
    }
    
    .details-panel {
      display: none; 
      width: 430px;
      margin-top: 10px;
      padding: 10px;
      background-color: #f8f9fa;
      border-top: 3px solid #4CAF50;
      font-size: 12px;
      line-height: 1.5;
    }
    
    .show-details {
      display: block;
    }
  </style>
</head>
<body>

  <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=450&h=240&fit=crop" alt="Beautiful Landscape" class="preview-image">

  <button class="info-btn" id="toggleBtn">查看資訊</button>

  <div class="details-panel" id="infoPanel">
    <div><strong>修改日期:</strong> 2017/10/12</div>
    <div><strong>類別:</strong> JPG</div>
    <div><strong>大小:</strong> 466.97KB</div>
    <div><strong>路徑:</strong> \\designcenter.qnap.com.tw\DesignCenter\PM...</div>
  </div>

  <script>
    var btn = document.getElementById('toggleBtn');
    var panel = document.getElementById('infoPanel');

    btn.addEventListener('click', function() {
      panel.classList.toggle('show-details');
      
      if (panel.classList.contains('show-details')) {
        btn.textContent = "隱藏資訊";
      } else {
        btn.textContent = "查看資訊";
      }
    });
  </script>

</body>
</html>
