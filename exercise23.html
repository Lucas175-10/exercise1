<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Engineer and Designer Cooperation</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      padding: 40px;
      background-color: #e9ecef; 
    }

    .ui-container {
      width: 496px;              
      background-color: #ffffff;
      margin: 0 auto;            
      box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
    }

    .header-bar {
      background-color: #f6f6f6; 
      height: 40px;              
      display: flex;             
      justify-content: flex-end; 
      align-items: center;       
      padding: 0 15px;           
    }

    .info-btn {
      height: 22px;
      border-radius: 8px;
      background-color: #ffffff;
      border: 1px solid #2f2f2f; 
      font-family: 'Roboto', sans-serif;
      font-size: 13px;
      color: #2f2f2f;
      cursor: pointer;
      padding: 0 18px; 
    }

    .image-wrapper {
      padding: 20px;             
      display: flex;
      justify-content: center;   
    }

    .preview-image {
      width: 450px;
      height: 240px;
      object-fit: cover;
    }

    .details-panel {
      display: none;
      margin: 0 20px 20px 20px;  
      padding: 10px;
      background-color: #ffffff;
      border-top: 3px solid #4CAF50;
      font-size: 12px;
      line-height: 1.5;
    }
    
    .show-details {
      display: block;
    }
  </style>
</head>
<body>

  <div class="ui-container">
    <div class="header-bar">
      <button class="info-btn" id="toggleBtn">查看資訊</button>
    </div>

    <div class="image-wrapper">
      <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=450&h=240&fit=crop" alt="Beautiful Landscape" class="preview-image">
    </div>

    <div class="details-panel" id="infoPanel">
      <div><strong>修改日期:</strong> 2017/10/12</div>
      <div><strong>類別:</strong> JPG</div>
      <div><strong>大小:</strong> 466.97KB</div>
      <div><strong>路徑:</strong> \\designcenter.qnap.com.tw\DesignCenter\PM...</div>
    </div>
  </div>

  <script>
    var btn = document.getElementById('toggleBtn');
    var panel = document.getElementById('infoPanel');

    btn.addEventListener('click', function() {
      panel.classList.toggle('show-details');
      
      if (panel.classList.contains('show-details')) {
        btn.textContent = "收起資訊"; 
      } else {
        btn.textContent = "查看資訊";
      }
    });
  </script>

</body>
</html>
