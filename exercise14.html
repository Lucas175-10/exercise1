<!DOCTYPE html>
<html>
<head>
<title>Shapes Overlap</title>
<style>
  .container {
    position: relative;
    margin: 50px; 
  }

 
  .rectangle {
    width: 150px;
    height: 120px;
    background-color: blue;     
    border: 4px solid black;     
    position: absolute;          
    top: 0;
    left: 0;
  }

  
  .circle {
    width: 100px;
    height: 100px;
    background-color: yellow;    
    border: 4px solid red;       
    border-radius: 50%;         
    position: absolute;          
    top: 20px;                  
    left: 100px;                
    z-index: 1;                
  }
</style>
</head>
<body>

  <div class="container">
    <div class="rectangle"></div>
    <div class="circle"></div>
  </div>

</body>
</html>
