<!DOCTYPE html>
<html>
<head>
<title>Table and Fixed Div</title>
<style>
  table {
    border-collapse: collapse; 
    margin: 50px;             
  }

  th, td {
    border: 1px solid black;  
    padding: 10px 20px;       
    text-align: left;
  }

  th {
    background-color: gray;
    color: white;
  }

  tr:nth-child(even) {
    background-color: yellow;
  }

  .fixed-box {
    position: fixed;           
    top: 30px;                
    right: 30px;               
    border: 3px solid #689f38; 
    padding: 10px;            
    width: 120px;              
    background-color: white;   
  }
</style>
</head>
<body>

  <table>
    <tr>
      <th>Firstname</th>
      <th>Lastname</th>
    </tr>
    <tr>
      <td>1</td>
      <td>1</td>
    </tr>
    <tr>
      <td>2</td>
      <td>2</td>
    </tr>
    <tr>
      <td>3</td>
      <td>3</td>
    </tr>
  </table>

  <div class="fixed-box">
    This div element has position: fixed;
  </div>

</body>
</html>
